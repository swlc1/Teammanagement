    if(!bar?.classList?.contains('bulk-delete-bar')){
      bar=document.createElement('div');bar.className='bulk-delete-bar';
      bar.innerHTML=`<div><b>다중선택</b><span>삭제할 항목을 체크한 후 선택 삭제를 누르세요.</span></div><div><span class="bulk-delete-count">0개 선택</span><button type="button" class="danger-btn bulk-delete-action">선택 삭제</button></div>`;
      wrap.parentNode.insertBefore(bar,wrap);bar.querySelector('.bulk-delete-action').onclick=bulkDeleteSelected;
    }
    const all=table.querySelector(`#bulkSelectAll-${tableIndex}`);
    const sync=()=>{const items=table.querySelectorAll('[data-bulk-select]'),checked=table.querySelectorAll('[data-bulk-select]:checked');bar.querySelector('.bulk-delete-count').textContent=`${checked.length}개 선택`;bar.classList.toggle('active',checked.length>0);if(all){all.checked=items.length>0&&checked.length===items.length;all.indeterminate=checked.length>0&&checked.length<items.length;}};
    if(all)all.onchange=()=>{table.querySelectorAll('[data-bulk-select]').forEach(c=>c.checked=all.checked);sync();};
    table.querySelectorAll('[data-bulk-select]').forEach(c=>c.onchange=sync);sync();
  });
}

function applyTheme(theme){

  const btn=document.getElementById('themeToggle');
  if(btn){
    btn.setAttribute('aria-pressed',normalized==='dark'?'true':'false');
    btn.title=normalized==='dark'?'라이트 모드로 전환':'다크 모드로 전환';
    btn.innerHTML=normalized==='dark'
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.7-.08-1.38-.23-2.03A7.4 7.4 0 0 1 12 3Z"/></svg>';
  }
}
function initTheme(){

  if(!saved){
    saved=window.matchMedia?.('(prefers-color-scheme: dark)').matches?'dark':'light';
  }
  applyTheme(saved);
  const btn=document.getElementById('themeToggle');
  if(btn)btn.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
}

function validateCoreRuntime(){
  const required=['login','logout','renderNav','go','ensureV3Data','canPage','updateSessionUI','globalSearch'];
  const missing=required.filter(n=>typeof globalThis[n]!=='function');
  if(missing.length)throw new Error('CORE_MISSING:'+missing.join(','));
  if(!Array.isArray(AUTH_USERS)||!ROLE_PAGES)throw new Error('AUTH_CONFIG_MISSING');
  return true;
}
async function init(){
  initTheme();
  validateCoreRuntime();
  currentUser=null;safeStorageRemove('tmd-session');
  const loginScreen=$('#loginScreen'),shell=$('#appShell'),form=$('#loginForm');
  if(loginScreen){loginScreen.classList.remove('hidden');loginScreen.style.display='grid';}
  if(shell){shell.classList.add('locked');shell.style.pointerEvents='none';shell.style.filter='blur(8px)';}
  if(!form)throw new Error('LOGIN_FORM_MISSING');
  form.onsubmit=async e=>{e.preventDefault();const err=$('#loginError');const btn=form.querySelector('button[type="submit"]');if(btn)btn.disabled=true;try{const ok=await login($('#loginId').value.trim(),$('#loginPw').value);if(err)err.textContent=ok?'':'아이디 또는 비밀번호를 확인해주세요.';}catch(ex){console.error('LOGIN_ERROR',ex);if(err)err.textContent=ex.message==='ACCOUNT_LOCKED'?'잠긴 계정입니다. 관리자에게 문의해주세요.':ex.message==='ACCOUNT_DISABLED'?'사용이 중지된 계정입니다. 관리자에게 문의해주세요.':'로그인 처리 중 오류가 발생했습니다.';}finally{if(btn)btn.disabled=false;}};
  try{ensureV3Data();await ensureAccountData();db.tasks.forEach(t=>t.status=autoStatus(t));save();}catch(ex){console.warn('DATA_REPAIR',ex);db=normalizeDbShape(seed());ensureV3Data();await ensureAccountData();}
  const sb=$('#sidebarToggle');if(sb)sb.onclick=e=>{e.preventDefault();e.stopPropagation();$('#sidebar').classList.toggle('collapsed');updateSidebarToggleUI();};updateSidebarToggleUI();
  if($('#mobileMenu'))$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('mobile-open');if($('#quickAdd'))$('#quickAdd').onclick=quickAdd;
  if($('#modalBackdrop')){$('#modalBackdrop').style.display='none';}if($('#drawerBackdrop')){$('#drawerBackdrop').style.display='none';$('#drawerBackdrop').onclick=e=>{if(e.target.id==='drawerBackdrop')closeDrawer()};}
  if($('#globalSearch'))$('#globalSearch').oninput=e=>globalSearch(e.target.value);
  document.addEventListener('keydown',e=>{if(currentUser&&e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch')?.focus()}if(e.key==='Escape'){closeModal();closeDrawer();$('.search-results')?.remove()}});
}

function showRuntimeError(err){
  console.error('TMD_RUNTIME_ERROR',err);
  const error=document.getElementById('loginError');
  if(error) error.textContent='시스템 초기화 중 오류가 발생했습니다. 페이지를 새로고침해주세요.';
}
async function bootApp(){
  try{await init();}
  catch(err){
    console.error('BOOT_ERROR',err);
    const login=document.getElementById('loginScreen');
    if(login) login.classList.remove('hidden');
    const error=document.getElementById('loginError');
    if(error) error.textContent='초기화 오류가 발생했습니다. 새로고침 후 다시 시도해주세요.';
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bootApp);
else bootApp();

</script>
</body>
</html>
