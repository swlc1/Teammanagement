/* ==========================================================================
   V4.0.0 — Human-crafted 2025–2026 Design System
   Visual layer only. Existing data model and user flows remain unchanged.
   ========================================================================== */

:root{
  --font-sans: Inter, "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ink-950:#0d1721;
  --ink-900:#162330;
  --ink-800:#243442;
  --ink-700:#3e5060;
  --ink-600:#5c6d7a;
  --ink-500:#7c8a95;
  --ink-400:#9da8b0;
  --ink-300:#bdc6cc;
  --ink-200:#d9e0e4;
  --ink-100:#edf1f3;
  --ink-50:#f7f9fa;

  --brand-950:#071d2e;
  --brand-900:#0c2c45;
  --brand-800:#123e5e;
  --brand-700:#185579;
  --brand-600:#236d97;
  --brand-500:#3988b4;
  --brand-400:#6aa9cd;
  --brand-100:#e7f1f7;
  --brand-50:#f3f8fb;

  --accent-600:#d96f17;
  --accent-500:#ef8730;
  --accent-400:#f7a354;
  --accent-100:#fff0e2;

  --success:#26835d;
  --success-bg:#e8f6ef;
  --warning:#b56718;
  --warning-bg:#fff3df;
  --danger:#bd4848;
  --danger-bg:#fdecec;

  --page:#f2f5f7;
  --surface:#ffffff;
  --surface-2:rgba(255,255,255,.72);
  --surface-3:#f8fafb;
  --line:#dce3e7;
  --line-strong:#cbd5db;
  --text:var(--ink-900);
  --muted:var(--ink-600);
  --sidebar-width:272px;
  --radius-xs:8px;
  --radius-sm:11px;
  --radius-md:15px;
  --radius-lg:20px;
  --radius-xl:26px;
  --shadow-xs:0 1px 2px rgba(18,39,55,.045);
  --shadow-sm:0 6px 20px rgba(18,39,55,.065);
  --shadow-md:0 18px 50px rgba(18,39,55,.10);
  --shadow-float:0 24px 70px rgba(7,29,46,.18);
  --ease:cubic-bezier(.2,.75,.25,1);
  --sidebar:var(--sidebar-width);
}

:root[data-theme="dark"]{
  --page:#0d141b;
  --surface:#151e27;
  --surface-2:rgba(21,30,39,.76);
  --surface-3:#1b2631;
  --line:#293640;
  --line-strong:#384751;
  --text:#edf3f6;
  --muted:#98a8b3;
  --ink-950:#f7fafb;
  --ink-900:#edf3f6;
  --ink-800:#d4dee4;
  --ink-700:#bdcad1;
  --ink-600:#98a8b3;
  --ink-500:#7f929e;
  --ink-400:#697d89;
  --ink-300:#53646f;
  --ink-200:#3c4a54;
  --ink-100:#26333d;
  --ink-50:#1a252e;
  --brand-100:#18394d;
  --brand-50:#122a3a;
  --shadow-xs:0 1px 2px rgba(0,0,0,.18);
  --shadow-sm:0 8px 28px rgba(0,0,0,.20);
  --shadow-md:0 20px 60px rgba(0,0,0,.28);
  --shadow-float:0 30px 80px rgba(0,0,0,.45);
}

html{background:var(--page);scroll-behavior:smooth}
body{
  font-family:var(--font-sans)!important;
  background:
    radial-gradient(circle at 92% -8%,rgba(57,136,180,.08),transparent 28%),
    radial-gradient(circle at 12% 104%,rgba(239,135,48,.055),transparent 24%),
    var(--page)!important;
  color:var(--text)!important;
  font-size:14px!important;
  line-height:1.55;
  letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,input,select,textarea{font-family:var(--font-sans)!important}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(57,136,180,.28)!important;
  outline-offset:2px!important;
}
::selection{background:rgba(57,136,180,.20)}

.app-shell{background:transparent!important}

/* Sidebar — darker, calmer, more editorial */
.sidebar{
  width:var(--sidebar-width)!important;
  background:
    radial-gradient(circle at 30% 0%,rgba(78,146,190,.14),transparent 24%),
    linear-gradient(180deg,#0a2234 0%,#0b283e 52%,#092034 100%)!important;
  border-right:1px solid rgba(255,255,255,.055);
  box-shadow:8px 0 32px rgba(4,19,30,.075);
  transition:width .28s var(--ease),transform .28s var(--ease)!important;
}
.sidebar.collapsed{width:78px!important}
.main{margin-left:var(--sidebar-width)!important;transition:margin-left .28s var(--ease)!important}
.sidebar.collapsed~.main{margin-left:78px!important}

.brand-row{
  height:84px!important;
  padding:0 18px!important;
  border-bottom:1px solid rgba(255,255,255,.075)!important;
}
.brand-ci-wrap{
  flex:1;
  min-width:0;
  border-radius:12px;
  padding:7px 7px 5px;
  background:rgba(255,255,255,.96);
  box-shadow:0 10px 25px rgba(0,0,0,.09);
}
.brand-ci{max-height:42px!important}
.sidebar-toggle{
  width:30px!important;height:30px!important;border-radius:50%!important;
  background:rgba(255,255,255,.09)!important;
  border:1px solid rgba(255,255,255,.12)!important;
  color:#d5e4ee!important;
  transition:transform .2s var(--ease),background .2s var(--ease)!important;
}
.sidebar-toggle:hover{background:rgba(255,255,255,.16)!important;transform:scale(1.04)}

#nav{padding:14px 10px 18px!important}
.nav-home-standalone{
  background:rgba(255,255,255,.055)!important;
  color:#d8e5ee!important;
  border:1px solid rgba(255,255,255,.075)!important;
  border-radius:12px!important;
  min-height:46px!important;
  padding:8px 9px!important;
  transition:all .2s var(--ease)!important;
}
.nav-home-standalone:hover{background:rgba(255,255,255,.095)!important;transform:translateX(2px)}
.nav-home-standalone.active{
  background:linear-gradient(135deg,rgba(69,141,187,.85),rgba(36,103,145,.92))!important;
  color:white!important;
  border-color:rgba(255,255,255,.14)!important;
  box-shadow:0 10px 22px rgba(14,60,90,.28);
}
.nav-main-divider{color:#668195!important;margin:8px 12px 10px!important}
.nav-main-divider:after{background:rgba(255,255,255,.08)!important}

.nav-group.accordion{margin:0 5px 5px!important}
.nav-group-toggle{
  color:#c4d4df!important;
  border-radius:10px!important;
  min-height:40px!important;
  transition:background .18s var(--ease)!important;
}
.nav-group-toggle:hover{background:rgba(255,255,255,.06)!important}
.nav-group-number{
  background:rgba(255,255,255,.08)!important;
  color:#a8c5d8!important;
  border:1px solid rgba(255,255,255,.07);
}
.nav-group.open .nav-group-number{
  background:rgba(239,135,48,.16)!important;
  color:#ffae68!important;
  border-color:rgba(239,135,48,.20);
}
.nav-chevron{color:#7e9bae!important}
.nav-submenu{
  border-left-color:rgba(255,255,255,.09)!important;
  margin-left:20px!important;
  padding-left:9px!important;
}
.nav-item{
  color:#aebfca!important;
  border-radius:10px!important;
  min-height:40px!important;
  transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease)!important;
}
.nav-item:hover{background:rgba(255,255,255,.055)!important;color:#fff!important;transform:translateX(2px)}
.nav-item.active{
  background:rgba(255,255,255,.095)!important;
  color:#fff!important;
  box-shadow:inset 2px 0 0 #f2943f;
}
.nav-icon-svg{
  width:29px!important;height:29px!important;border-radius:9px!important;
  background:color-mix(in srgb,var(--icon-color) 15%,transparent)!important;
}
.nav-icon-svg svg{width:15px!important;height:15px!important}
.sidebar-footer{
  margin:8px;
  padding:11px!important;
  border:1px solid rgba(255,255,255,.07)!important;
  border-radius:14px;
  background:rgba(255,255,255,.035);
  backdrop-filter:blur(12px);
}
.sidebar-logout,.nav-edit-mini{
  border-radius:9px!important;
  border-color:rgba(255,255,255,.1)!important;
  background:rgba(255,255,255,.055)!important;
  color:#cfdae2!important;
}
.sidebar-logout:hover,.nav-edit-mini:hover{background:rgba(255,255,255,.10)!important}

/* Topbar */
.topbar{
  height:74px!important;
  padding:0 26px!important;
  background:color-mix(in srgb,var(--surface) 80%,transparent)!important;
  border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent)!important;
  box-shadow:0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(22px) saturate(145%)!important;
  -webkit-backdrop-filter:blur(22px) saturate(145%)!important;
}
.breadcrumb{font-size:15px!important;font-weight:760!important;letter-spacing:-.025em}
.global-search{
  height:42px!important;
  border:1px solid var(--line)!important;
  border-radius:13px!important;
  background:color-mix(in srgb,var(--surface) 70%,var(--surface-3))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),var(--shadow-xs);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease);
}
.global-search:focus-within{
  border-color:rgba(57,136,180,.55)!important;
  box-shadow:0 0 0 4px rgba(57,136,180,.10),var(--shadow-sm);
  transform:translateY(-1px);
}
.global-search input{color:var(--text)!important}
.global-search kbd{
  background:var(--surface)!important;
  color:var(--muted)!important;
  border-color:var(--line)!important;
  box-shadow:var(--shadow-xs);
}
.top-action-btn{
  width:38px!important;height:38px!important;
  display:grid!important;place-items:center!important;
  border:1px solid var(--line)!important;
  background:var(--surface-2)!important;
  color:var(--ink-700)!important;
  border-radius:11px!important;
  transition:transform .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease)!important;
}
.top-action-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top-action-btn:hover{transform:translateY(-1px);background:var(--surface)!important;box-shadow:var(--shadow-sm)!important}
.session-chip{
  min-height:40px!important;
  border-radius:12px!important;
  border:1px solid var(--line)!important;
  background:var(--surface-2)!important;
  color:var(--text)!important;
  box-shadow:var(--shadow-xs);
}
.quick-add-modern{
  border-radius:12px!important;
  padding:10px 15px!important;
  background:linear-gradient(135deg,var(--brand-700),var(--brand-600))!important;
  box-shadow:0 8px 18px rgba(28,97,138,.21)!important;
}
.quick-add-modern:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(28,97,138,.27)!important}

/* Content rhythm */
.content{padding:28px 30px 44px!important;max-width:1920px!important}
.page-head{margin-bottom:20px!important}
.page-title h1{font-size:25px!important;font-weight:790!important;letter-spacing:-.04em!important;color:var(--text)!important}
.page-title p{font-size:12px!important;color:var(--muted)!important;max-width:760px}
.page-head .primary-btn{align-self:flex-start}

.primary-btn,.secondary-btn,.danger-btn{
  border-radius:11px!important;
  min-height:38px;
  font-size:12px!important;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s var(--ease)!important;
}
.primary-btn{background:linear-gradient(135deg,var(--brand-700),var(--brand-600))!important;color:#fff!important;box-shadow:0 6px 14px rgba(35,109,151,.16)}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(35,109,151,.22)}
.secondary-btn{background:var(--surface-3)!important;color:var(--ink-700)!important;border:1px solid var(--line)!important}
.danger-btn{background:var(--danger-bg)!important;color:var(--danger)!important;border:1px solid color-mix(in srgb,var(--danger) 18%,transparent)!important}

/* Panels/cards */
.panel,.ops-panel,.project-accordion,.table-wrap,.calendar-wrap{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  box-shadow:var(--shadow-xs)!important;
}
.panel,.ops-panel{
  border-radius:var(--radius-md)!important;
}
.panel{
  padding:18px!important;
}
.panel:hover{border-color:color-mix(in srgb,var(--line-strong) 90%,var(--brand-400))!important}
.panel-head{margin-bottom:14px!important}
.panel h3{font-size:14px!important;font-weight:760!important;letter-spacing:-.025em}
.meta{color:var(--muted)!important}

.kpi-grid{gap:10px!important}
.kpi-card{
  position:relative;
  overflow:hidden;
  border-radius:14px!important;
  border:1px solid var(--line)!important;
  background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--brand-50)))!important;
  box-shadow:var(--shadow-xs)!important;
  padding:16px 15px!important;
}
.kpi-card:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--brand-500),var(--accent-500));
  opacity:.55;
}
.kpi-card:hover{transform:translateY(-2px)!important;box-shadow:var(--shadow-sm)!important}
.kpi-card .label{font-size:11px!important;color:var(--muted)!important}
.kpi-card .value{font-size:25px!important;font-weight:800!important;letter-spacing:-.045em!important}

/* Home */
.home-intel-hero{
  min-height:290px!important;
  border-radius:22px!important;
  border:1px solid color-mix(in srgb,var(--brand-600) 22%,var(--line))!important;
  background:
    radial-gradient(circle at 76% 18%,rgba(91,170,215,.25),transparent 26%),
    radial-gradient(circle at 12% 90%,rgba(239,135,48,.16),transparent 25%),
    linear-gradient(118deg,#071e30 0%,#0c304b 43%,#e9f5fb 43.2%,#f7fbfd 100%)!important;
  box-shadow:0 22px 55px rgba(15,55,82,.13)!important;
}
.hero-copy{padding:44px 34px!important}
.hero-copy h1{font-size:31px!important;letter-spacing:-.052em!important}
.hero-copy p{font-size:11px!important;color:#c5d9e5!important}
.hero-static-badges span{
  border-radius:999px!important;
  background:rgba(255,255,255,.075)!important;
  backdrop-filter:blur(8px);
}
.flow-node{border-radius:14px!important;box-shadow:0 14px 32px rgba(37,73,95,.11)!important}
.flow-core{border-radius:30px!important;box-shadow:0 18px 44px rgba(22,65,94,.21)!important}

.attention-strip{
  border-radius:16px!important;
  border:1px solid var(--line)!important;
  background:var(--surface)!important;
  box-shadow:var(--shadow-xs)!important;
  overflow:hidden!important;
}
.attention-cell{
  background:transparent!important;
  border-color:var(--line)!important;
  transition:background .18s var(--ease),transform .18s var(--ease)!important;

.home-three-tier.home-vertical-stack{

}

}

.row-edit,.row-delete{

/* Filters/forms */

}

}

/* Badges/status */

}

.unit-project-row{background:var(--surface)!important;border-radius:10px;margin:5px 0;border:1px solid var(--line)!important}

/* Calendar */

.cal-date{color:var(--ink-600)!important;font-weight:700!important}

/* Modal & drawer */
.modal-backdrop,.drawer-backdrop{

/* Profile & account surfaces */
.account-card,.member-top{

.counsel-grid-card{
  min-height:320px;display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:17px;background:var(--surface);
  box-shadow:var(--shadow-xs);overflow:hidden;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);
}
.counsel-grid-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--line-strong)}
.counsel-grid-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px;background:linear-gradient(180deg,var(--surface),var(--surface-3));
  border-bottom:1px solid var(--line);
}
.counsel-grid-person{display:flex;align-items:center;gap:9px;min-width:0}
.counsel-grid-person .member-avatar{width:40px;height:40px;flex:0 0 40px}
.counsel-grid-person>div:last-child{min-width:0;display:flex;flex-direction:column;gap:2px}
.counsel-grid-person b{font-size:13px;color:var(--text)}
.counsel-grid-person span{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counsel-card-add{
  width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--brand-700);font-size:17px;cursor:pointer;
  transition:background .15s var(--ease),transform .15s var(--ease);
}
.counsel-card-add:hover{background:var(--brand-50);transform:scale(1.04)}
.counsel-grid-meta{
  display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);
}
.counsel-grid-meta>div{padding:10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.counsel-grid-meta>div:last-child{border-right:0}
.counsel-grid-meta span{font-size:8px;color:var(--muted)}
.counsel-grid-meta b{font-size:10px;color:var(--text)}
.counsel-grid-body{padding:14px;flex:1}
.counsel-type-chip{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--brand-50);color:var(--brand-700);font-size:8px;font-weight:800}
.counsel-grid-body h4{font-size:13px;margin:9px 0 6px;color:var(--text)}
.counsel-grid-body p{font-size:10px;line-height:1.65;color:var(--ink-700);margin:0 0 13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.counsel-grid-action{padding:10px;border-radius:10px;background:var(--surface-3);display:flex;flex-direction:column;gap:3px}
.counsel-grid-action span{font-size:8px;color:var(--muted)}
.counsel-grid-action b{font-size:10px;color:var(--text);line-height:1.45}
.counsel-grid-footer{
  min-height:48px;padding:8px 12px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.counsel-grid-footer>span{font-size:8px;color:var(--muted)}
.counsel-grid-footer>div{display:flex;gap:5px}
.counsel-card-empty{height:100%;min-height:120px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:10px}
:root[data-theme="dark"] .counsel-grid-body p{color:#c7d3da!important}

@media(max-width:1250px){.counsel-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  .counsel-card-grid{grid-template-columns:1fr}
  .bulk-delete-bar{align-items:flex-start;flex-direction:column}
  .bulk-delete-bar>div:last-child{width:100%;justify-content:space-between}
}

/* V4.1.4 */
.member-position-cell{font-weight:760!important;color:var(--text)!important}
.bulk-delete-bar.active{border-color:color-mix(in srgb,var(--danger) 30%,var(--line));background:color-mix(in srgb,var(--danger-bg) 45%,var(--surface));box-shadow:var(--shadow-sm)}
.bulk-delete-bar.active .bulk-delete-count{color:var(--danger);font-weight:800}
.monthly-board-table.no-auto-number tbody>tr>td:first-child::before{display:none!important}
.monthly-no-col{width:64px!important;text-align:center!important}.monthly-no-cell{text-align:center!important;font-size:10px!important;font-weight:800!important;font-variant-numeric:tabular-nums;color:var(--ink-600)!important}
.counsel-history-toggle-wrap{border-top:1px solid var(--line);background:var(--surface-3)}
.counsel-history-toggle{width:100%;min-height:44px;padding:0 13px;border:0;background:transparent;color:var(--text);display:grid;grid-template-columns:1fr auto 20px;align-items:center;gap:8px;text-align:left;cursor:pointer}
.counsel-history-toggle:hover{background:color-mix(in srgb,var(--brand-50) 70%,var(--surface))}
.counsel-history-toggle span{font-size:10px;font-weight:760}.counsel-history-toggle b{font-size:9px;color:var(--brand-700)}.counsel-history-toggle i{font-style:normal;text-align:center;color:var(--muted);font-size:14px}
.counsel-full-history{display:none;padding:5px 13px 14px;background:var(--surface)}.counsel-history-card.history-open .counsel-full-history{display:block}
.counsel-timeline-item{display:grid;grid-template-columns:38px minmax(0,1fr);gap:9px;position:relative;padding-top:12px}.timeline-marker{position:relative;display:flex;flex-direction:column;align-items:center}.timeline-marker span{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--brand-50);color:var(--brand-700);font-size:8px;font-weight:800;z-index:1}.timeline-marker i{position:absolute;top:27px;bottom:-14px;width:1px;background:var(--line)}.counsel-timeline-item:last-child .timeline-marker i{display:none}
.timeline-content{border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--surface-3)}.timeline-top{display:flex;justify-content:space-between;gap:10px}.timeline-top>div:first-child{display:flex;flex-direction:column;gap:2px}.timeline-top b{font-size:11px;color:var(--text)}.timeline-top span{font-size:8px;color:var(--muted)}.timeline-actions{display:flex;gap:4px;align-items:flex-start}.timeline-content>p{font-size:10px;line-height:1.65;color:var(--ink-700);margin:9px 0}.timeline-follow{display:flex;flex-direction:column;gap:2px;padding:8px 9px;border-radius:8px;background:var(--surface)}.timeline-follow span,.timeline-follow small{font-size:8px;color:var(--muted)}.timeline-follow b{font-size:9px;color:var(--text)}

/* V4.1.5 Monthly work slide viewer hotfix */
#drawer.slide-drawer .drawer-body.monthly-slide-drawer-content{
  padding:0!important;
  overflow:hidden!important;
  background:#eef1f3!important;
}
.monthly-slide-loading,.monthly-slide-error{
  min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  color:var(--muted);font-size:11px;text-align:center;
}
.monthly-slide-error b{font-size:14px;color:var(--text)}
:root[data-theme="dark"] #drawer.slide-drawer .drawer-body.monthly-slide-drawer-content{background:#101820!important}
:root[data-theme="dark"] .monthly-slide-topbar,
:root[data-theme="dark"] .monthly-slide-controls{background:#18242d!important;border-color:#31404a!important}
:root[data-theme="dark"] .monthly-slide-topbar b{color:#edf3f6!important}

/* V4.1.6 — Monthly Work Editor scroll / layout stabilization */
#modal.monthly-work-modal{
  width:min(1120px,calc(100vw - 48px))!important;
  height:min(860px,calc(100vh - 42px))!important;
  max-height:calc(100vh - 42px)!important;
  overflow:hidden!important;
  display:flex!important;
  flex-direction:column!important;
}
#modal.monthly-work-modal .modal-head{
  flex:0 0 auto!important;
  position:relative!important;
  z-index:4;
  background:var(--surface)!important;
}
#modal.monthly-work-modal .modal-body.monthly-work-modal-body{
  flex:1 1 auto!important;
  min-height:0!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  overscroll-behavior:contain;
  scrollbar-gutter:stable;
  padding:20px 22px 30px!important;
  scroll-behavior:smooth;
}
#modal.monthly-work-modal .modal-footer{
  flex:0 0 auto!important;
  position:relative!important;
  z-index:5;
  background:color-mix(in srgb,var(--surface-3) 92%,var(--surface))!important;
  box-shadow:0 -8px 22px rgba(17,40,57,.06);
}
.monthly-work-editor-shell{
  width:100%;
  min-width:0;
}
.monthly-work-basic-grid{
  position:relative;
  z-index:1;
}
.monthly-editor-head{
  position:sticky!important;
  top:-20px!important;
  z-index:3!important;
  margin:20px -2px 8px!important;
  padding:14px 2px 10px!important;
  background:linear-gradient(180deg,var(--surface) 76%,color-mix(in srgb,var(--surface) 92%,transparent))!important;
  backdrop-filter:blur(8px);
}
.monthly-editor-head>div{gap:2px}
.monthly-section-count{
  display:block;
  margin-top:3px;
  color:var(--brand-600)!important;
  font-size:9px!important;
  font-weight:780;
}
#monthlySectionsEditor{
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:9px;
  padding-bottom:8px;
}
.monthly-section-editor{
  width:100%!important;
  min-width:0!important;
  display:grid!important;
  grid-template-columns:34px minmax(150px,190px) minmax(0,1fr) 52px!important;
  gap:10px!important;
  align-items:start!important;
  border:1px solid var(--line)!important;
  border-radius:12px!important;
  padding:12px!important;
  background:var(--surface-3)!important;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease),background .18s var(--ease);
}
.monthly-section-editor:last-child{border-bottom:1px solid var(--line)!important}
.monthly-section-editor:focus-within{
  border-color:color-mix(in srgb,var(--brand-500) 42%,var(--line))!important;
  box-shadow:0 0 0 3px rgba(57,136,180,.07);
  background:var(--surface)!important;
}
.monthly-section-new{animation:monthlySectionIn .36s var(--ease)}
@keyframes monthlySectionIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.monthly-category-col,.monthly-content-col{
  min-width:0!important;
  width:100%!important;
}
.monthly-section-editor .input{
  width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
}
.monthly-section-editor .monthly-content-input{
  min-height:132px!important;
  max-height:360px!important;
  resize:vertical!important;
  overflow-x:hidden!important;
  white-space:pre-wrap!important;
  overflow-wrap:anywhere;
  line-height:1.65!important;
}
.monthly-editor-no{
  width:28px!important;height:28px!important;border-radius:8px!important;
  background:var(--brand-800)!important;
  color:#fff!important;
}
.monthly-remove{
  width:100%!important;
  min-height:34px!important;
  border-radius:8px!important;
  background:var(--surface)!important;
  border:1px solid color-mix(in srgb,var(--danger) 20%,var(--line))!important;
  color:var(--danger)!important;
}
.monthly-remove:hover{background:var(--danger-bg)!important}
:root[data-theme="dark"] #modal.monthly-work-modal .modal-footer{
  box-shadow:0 -8px 22px rgba(0,0,0,.20);
}

@media(max-width:900px){
  #modal.monthly-work-modal{
    width:calc(100vw - 20px)!important;
    height:calc(100vh - 20px)!important;
    max-height:calc(100vh - 20px)!important;
  }
  #modal.monthly-work-modal .modal-body.monthly-work-modal-body{padding:16px 14px 26px!important}
  .monthly-editor-head{top:-16px!important}
  .monthly-section-editor{
    grid-template-columns:32px minmax(0,1fr) 48px!important;
  }
  .monthly-category-col{grid-column:2/3}
  .monthly-content-col{grid-column:2/4}
  .monthly-remove{grid-column:3/4;grid-row:1/2}
}
@media(max-width:560px){
  .monthly-work-basic-grid{grid-template-columns:1fr!important}
  .monthly-work-basic-grid .field.full{grid-column:1!important}
  .monthly-section-editor{
    grid-template-columns:30px minmax(0,1fr)!important;
    padding:10px!important;
  }
  .monthly-category-col,.monthly-content-col{grid-column:2!important}
  .monthly-remove{grid-column:2!important;grid-row:auto!important;width:72px!important}
  .monthly-editor-head{align-items:flex-start!important;gap:8px!important}
}
@media(prefers-reduced-motion:reduce){
  .monthly-section-new{animation:none!important}
  #modal.monthly-work-modal .modal-body.monthly-work-modal-body{scroll-behavior:auto!important}
}

/* V4.2.0 — Monthly rich text + exclusive authoring modes + PDF viewer */
.monthly-mode-section{margin-top:18px;border-top:1px solid var(--line);padding-top:2px}
.monthly-editor-head.mode-head{position:relative!important;top:auto!important;margin:12px 0 8px!important;padding:10px 0 5px!important;background:transparent!important}
.monthly-mode-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.monthly-mode-card{
  position:relative;display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
  border-radius:13px;background:var(--surface-3);cursor:pointer;transition:.18s var(--ease);
}
.monthly-mode-card:hover{border-color:var(--line-strong);background:var(--surface)}
.monthly-mode-card.active{border-color:var(--brand-500);background:var(--brand-50);box-shadow:0 0 0 3px rgba(57,136,180,.07)}
.monthly-mode-card>input{position:absolute;opacity:0;pointer-events:none}
.monthly-mode-card .mode-icon{
  width:42px;height:42px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--brand-700);font-size:11px;font-weight:850;flex:0 0 42px
}
.monthly-mode-card>div{display:flex;flex-direction:column;gap:3px}
.monthly-mode-card b{font-size:12px;color:var(--text)}
.monthly-mode-card small{font-size:9px;color:var(--muted);line-height:1.45}
.monthly-mode-warning{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--warning-bg);color:var(--warning);font-size:9px;line-height:1.5}
#monthlyDirectPanel[hidden],#monthlyPdfPanel[hidden]{display:none!important}

.monthly-rich-toolbar{
  min-height:36px;display:flex;align-items:center;gap:5px;padding:5px 7px;background:var(--surface);
  border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;
}
.monthly-rich-toolbar>span{font-size:8px;color:var(--muted);margin-right:4px}
.rich-tool-btn,.rich-color-tool,.rich-color-swatch{
  height:25px;border:1px solid var(--line);background:var(--surface-3);border-radius:6px;cursor:pointer
}
.rich-tool-btn{min-width:28px;color:var(--text)}
.rich-tool-btn:hover,.rich-color-tool:hover{background:var(--brand-50);border-color:var(--brand-400)}
.rich-color-tool{position:relative;width:31px;display:grid;place-items:center;font-weight:800;color:var(--text)}
.rich-color-tool input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.rich-color-swatch{width:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.rich-color-swatch.navy{background:#17334a}.rich-color-swatch.blue{background:#236d97}.rich-color-swatch.orange{background:#d96f17}.rich-color-swatch.red{background:#bd4848}
.monthly-rich-editor{
  width:100%;min-height:145px;max-height:380px;overflow-y:auto!important;overflow-x:hidden!important;
  border-radius:0 0 9px 9px!important;line-height:1.75!important;white-space:pre-wrap;overflow-wrap:anywhere;
  padding:11px 12px!important;background:var(--surface)!important;color:var(--text)!important;
}
.monthly-rich-editor:empty:before{content:attr(data-placeholder);color:var(--ink-400)}
.monthly-rich-editor:focus{outline:none!important;border-color:var(--brand-500)!important;box-shadow:0 0 0 3px rgba(57,136,180,.08)!important}
.monthly-rich-preview{white-space:normal!important}
.monthly-rich-preview p,.monthly-rich-preview div{margin:0 0 .45em}
.monthly-rich-preview span[style]{display:inline}

#monthlyPdfPanel{padding-bottom:10px}
.monthly-pdf-drop{
  min-height:190px;border:1.5px dashed var(--line-strong);border-radius:14px;background:var(--surface-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  transition:.18s var(--ease)
}
.monthly-pdf-drop:hover{background:var(--brand-50);border-color:var(--brand-400)}
.monthly-pdf-drop input{display:none}
.monthly-pdf-drop .pdf-icon{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:#fbe9e8;color:#b63f3f;font-weight:900;font-size:11px}
.monthly-pdf-drop b{font-size:12px}.monthly-pdf-drop small{font-size:9px;color:var(--muted)}
.monthly-pdf-attached{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--surface-3)}
.monthly-pdf-attached>div:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.monthly-pdf-attached b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthly-pdf-attached span{font-size:9px;color:var(--muted)}
.monthly-pdf-attached>div:last-child{display:flex;gap:7px;align-items:center}

.monthly-pdf-viewer-shell{height:100%;display:flex;flex-direction:column;background:#e8edf0}
.monthly-pdf-toolbar{
  min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;
  background:var(--surface);border-bottom:1px solid var(--line)
}
.pdf-page-nav,.pdf-zoom-nav{display:flex;align-items:center;gap:7px}
.pdf-page-nav>span,.pdf-zoom-nav>span{font-size:9px;color:var(--muted);white-space:nowrap}
.pdf-page-readout{display:flex;gap:4px;align-items:baseline;color:#d6e5ef}.pdf-page-readout b{font-size:16px}.pdf-page-readout span{font-size:9px}
.monthly-pdf-frame-wrap{position:relative;flex:1;min-height:0;padding:12px;background:#cfd7dc}
.monthly-pdf-frame{width:100%;height:100%;min-height:570px;border:0;background:#fff;border-radius:8px;box-shadow:0 8px 26px rgba(16,43,61,.16)}
.monthly-pdf-error{position:absolute;inset:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface);border-radius:8px}
.monthly-pdf-error.hidden{display:none!important}
.monthly-pdf-error b{font-size:14px}.monthly-pdf-error span{font-size:10px;color:var(--muted)}

:root[data-theme="dark"] .monthly-mode-card.active{background:#163247}
:root[data-theme="dark"] .monthly-pdf-viewer-shell{background:#101820}
:root[data-theme="dark"] .monthly-pdf-frame-wrap{background:#0d141b}

@media(max-width:800px){
  .monthly-mode-options{grid-template-columns:1fr}
  .monthly-pdf-toolbar{align-items:flex-start;flex-direction:column}
  .monthly-pdf-frame{min-height:500px}
  .monthly-pdf-attached{align-items:flex-start;flex-direction:column}
}

/* V4.3.0 — Team privacy/readability + counseling detail + account administration */

/* 팀원정보 가독성 */
.team-list-panel{overflow:hidden!important}
.team-list-table-wrap{
  border:1px solid var(--line);border-radius:12px;overflow:auto;
  scrollbar-gutter:stable;
}
.team-list-table{min-width:1500px!important}
.team-list-table th{
  padding:13px 12px!important;
  font-size:10.5px!important;font-weight:800!important;
  color:var(--ink-700)!important;
  background:color-mix(in srgb,var(--surface-3) 90%,var(--brand-50))!important;
}
.team-list-table td{
  padding:14px 12px!important;
  font-size:11px!important;line-height:1.55!important;
  vertical-align:middle!important;
}
.team-list-table tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-3) 52%,var(--surface))}
.team-list-table tbody tr:hover{background:color-mix(in srgb,var(--brand-50) 72%,var(--surface))!important}
.team-list-table td[data-label] b,.team-list-table td[data-label] span{line-height:1.45}
.team-list-table .team-project-names,.team-list-table td>small{margin-top:3px!important;display:block!important}
.team-list-table .row-actions{flex-wrap:nowrap!important}

/* 상담 카드 내부 목록 */
.counsel-list-card{min-height:280px!important}
.counsel-record-list{display:flex;flex-direction:column;padding:6px 10px 10px;max-height:350px;overflow-y:auto}
.counsel-record-item{
  display:grid;grid-template-columns:28px 76px minmax(0,1fr) 18px;gap:8px;align-items:center;
  width:100%;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;
  color:var(--text);text-align:left;cursor:pointer;transition:background .15s var(--ease),transform .15s var(--ease);
}
.counsel-record-item:last-child{border-bottom:0}
.counsel-record-item:hover{background:var(--brand-50);transform:translateX(2px)}
.counsel-record-no{font-size:8px;font-weight:850;color:var(--brand-700);font-variant-numeric:tabular-nums}
.counsel-record-date{font-size:9px;color:var(--muted);white-space:nowrap}
.counsel-record-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.counsel-record-main b{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counsel-record-main small{font-size:8.5px;color:var(--muted)}
.counsel-record-arrow{font-size:18px;color:var(--ink-400);text-align:right}
.counsel-detail-modal{display:flex;flex-direction:column;gap:14px}
.counsel-detail-person{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-3)}
.counsel-detail-person>div{display:flex;flex-direction:column}.counsel-detail-person b{font-size:13px}.counsel-detail-person span{font-size:9px;color:var(--muted)}
.counsel-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.counsel-detail-grid>div{display:flex;flex-direction:column;gap:3px;padding:10px;border:1px solid var(--line);border-radius:10px}

.account-management-panel{grid-column:1/-1}

  padding:11px 12px;margin-bottom:9px;border:1px solid var(--line);border-radius:11px;background:var(--surface-3)
}

.account-person{display:flex;align-items:center;gap:8px}.account-person b{font-size:11px}.account-username{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}

.account-status.active{background:var(--success-bg);color:var(--success)}.account-status.locked{background:var(--warning-bg);color:var(--warning)}.account-status.disabled{background:var(--danger-bg);color:var(--danger)}.account-status.none{background:var(--ink-100);color:var(--muted)}
.account-actions{display:flex;gap:5px;align-items:center;white-space:nowrap}
.secondary-mini{min-height:28px;padding:4px 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-700);font-size:8px;cursor:pointer}
.secondary-mini:hover{background:var(--brand-50)}
.account-log-head{display:flex;justify-content:space-between;align-items:end;margin:16px 0 7px}.account-log-head b{font-size:11px}.account-log-head span{font-size:8px;color:var(--muted)}
.account-log-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.account-log-row{display:grid;grid-template-columns:125px 100px 105px 130px 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:8.5px;align-items:center}

.account-editor{display:flex;flex-direction:column;gap:13px}.account-editor-person{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-3)}.account-editor-person>div{display:flex;flex-direction:column}
.field-help{display:block;margin-top:4px;font-size:8.5px;color:var(--muted)}
.account-toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.account-toggle-grid label{display:flex;align-items:center;gap:7px;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:10px}
.password-reset-box{display:flex;flex-direction:column;gap:12px}

/* Mobile team info becomes label/value cards */

    line-height:1.6!important;
  }
  .monthly-slide-shell:fullscreen .ppt-header h1,
  .monthly-slide-shell.monthly-app-fullscreen .ppt-header h1{
    font-size:clamp(30px,2.7vw,48px)!important;
  }
  .monthly-slide-shell:fullscreen .ppt-body,
  .monthly-slide-shell.monthly-app-fullscreen .ppt-body{
    padding:22px 0 15px!important;
  }
}

/* UHD/고해상도 화면에서는 과도하게 작아지지 않도록 */
@media(min-width:1800px) and (min-height:950px){
  .monthly-slide-shell:fullscreen .monthly-scale-target,
  .monthly-slide-shell.monthly-app-fullscreen .monthly-scale-target{
    width:min(86vw,1680px)!important;
    max-width:1680px!important;
  }
  .monthly-slide-shell:fullscreen .ppt-content,
  .monthly-slide-shell.monthly-app-fullscreen .ppt-content{
    font-size:clamp(20px,1.2vw,26px)!important;
  }
}


/* V5.1.3 — Stable fullscreen container: Drawer remains mounted while slides rerender */
#drawer.slide-drawer:fullscreen,
#drawer.slide-drawer.monthly-app-fullscreen{
  width:100vw!important;
  height:100vh!important;
  max-width:none!important;
  max-height:none!important;
  inset:0!important;
  border-radius:0!important;
  background:#e8edf0!important;
  overflow:hidden!important;
}

#drawer.slide-drawer:fullscreen .drawer-head,
#drawer.slide-drawer.monthly-app-fullscreen .drawer-head{
  display:none!important;
}

#drawer.slide-drawer:fullscreen .drawer-body,
#drawer.slide-drawer.monthly-app-fullscreen .drawer-body{
  height:100vh!important;
  max-height:none!important;
  padding:0!important;
  overflow:hidden!important;
}

#drawer.slide-drawer:fullscreen .monthly-slide-shell,
#drawer.slide-drawer.monthly-app-fullscreen .monthly-slide-shell{
  width:100vw!important;
  height:100vh!important;
  max-width:none!important;
  background:#e8edf0!important;
}

#drawer.slide-drawer:fullscreen .monthly-slide-stage,
#drawer.slide-drawer.monthly-app-fullscreen .monthly-slide-stage{
  grid-template-columns:58px minmax(0,1fr) 58px!important;
  gap:18px!important;
  padding:18px 24px!important;
  overflow:hidden!important;
  align-items:center!important;
}

#drawer.slide-drawer:fullscreen .monthly-scale-target,
#drawer.slide-drawer.monthly-app-fullscreen .monthly-scale-target{
  transform:none!important;
  width:min(88vw,1600px)!important;
  height:auto!important;
  max-width:1600px!important;
  max-height:calc(100vh - 150px)!important;
  aspect-ratio:16/9!important;
  margin:auto!important;
  padding:4.3% 5.2% 3.6%!important;
  box-shadow:0 22px 70px rgba(16,43,61,.22)!important;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

/* Drawer fullscreen에서도 V5.1.2의 확대 타이포그래피 적용 */
#drawer.slide-drawer:fullscreen .ppt-header,
#drawer.slide-drawer.monthly-app-fullscreen .ppt-header{
  padding-bottom:20px!important;
  border-bottom-width:3px!important;
}
#drawer.slide-drawer:fullscreen .ppt-header span,
#drawer.slide-drawer.monthly-app-fullscreen .ppt-header span{
  font-size:clamp(12px,1vw,17px)!important;
  letter-spacing:.12em!important;
}
#drawer.slide-drawer:fullscreen .ppt-header h1,
#drawer.slide-drawer.monthly-app-fullscreen .ppt-header h1{
  font-size:clamp(34px,3.1vw,56px)!important;
  line-height:1.18!important;
  letter-spacing:-.04em!important;
  margin-top:10px!important;
}
#drawer.slide-drawer:fullscreen .ppt-section-no,
#drawer.slide-drawer.monthly-app-fullscreen .ppt-section-no{
  font-size:clamp(48px,5vw,82px)!important;
}
#drawer.slide-drawer:fullscreen .ppt-body,
#drawer.slide-drawer.monthly-app-fullscreen .ppt-body{
  grid-template-columns:170px minmax(0,1fr)!important;
  gap:40px!important;
  padding:32px 0 22px!important;
}
#drawer.slide-drawer:fullscreen .ppt-label,
#drawer.slide-drawer.monthly-app-fullscreen .ppt-label{
  font-size:clamp(15px,1.25vw,20px)!important;
  line-height:1.5!important;
  border-top-width:4px!important;
  padding-top:12px!important;
}
#drawer.slide-drawer:fullscreen .ppt-content,
#drawer.slide-drawer.monthly-app-fullscreen .ppt-content{
  font-size:clamp(17px,1.35vw,23px)!important;
  line-height:1.75!important;
  padding-right:14px!important;
  overflow:auto!important;
  letter-spacing:-.015em!important;
}
#drawer.slide-drawer:fullscreen .ppt-footer,
#drawer.slide-drawer.monthly-app-fullscreen .ppt-footer{
  grid-template-columns:220px 1fr 70px!important;
  gap:20px!important;
  padding-top:14px!important;
  font-size:clamp(10px,.8vw,13px)!important;
}
#drawer.slide-drawer:fullscreen .slide-nav,
#drawer.slide-drawer.monthly-app-fullscreen .slide-nav{
  width:52px!important;
  height:82px!important;
  border-radius:12px!important;
  font-size:38px!important;
}
#drawer.slide-drawer:fullscreen .monthly-slide-topbar,
#drawer.slide-drawer.monthly-app-fullscreen .monthly-slide-topbar{
  min-height:64px!important;
  padding:0 24px!important;
}
#drawer.slide-drawer:fullscreen .monthly-slide-controls,
#drawer.slide-drawer.monthly-app-fullscreen .monthly-slide-controls{
  min-height:58px!important;
  padding:0 24px!important;
}

:root[data-theme="dark"] #drawer.slide-drawer:fullscreen,
:root[data-theme="dark"] #drawer.slide-drawer.monthly-app-fullscreen,
:root[data-theme="dark"] #drawer.slide-drawer:fullscreen .monthly-slide-shell,
:root[data-theme="dark"] #drawer.slide-drawer.monthly-app-fullscreen .monthly-slide-shell{
  background:#101820!important;
}

@media(max-height:800px){
  #drawer.slide-drawer:fullscreen .monthly-scale-target,
  #drawer.slide-drawer.monthly-app-fullscreen .monthly-scale-target{
    width:min(82vw,1380px)!important;
    max-height:calc(100vh - 138px)!important;
  }
  #drawer.slide-drawer:fullscreen .ppt-content,
  #drawer.slide-drawer.monthly-app-fullscreen .ppt-content{
    font-size:clamp(15px,1.15vw,20px)!important;
    line-height:1.6!important;
  }
  #drawer.slide-drawer:fullscreen .ppt-header h1,
  #drawer.slide-drawer.monthly-app-fullscreen .ppt-header h1{
    font-size:clamp(30px,2.7vw,48px)!important;
  }
}

/* V5.3 Portable data transfer */
.backup-transfer-panel{
  border-color:color-mix(in srgb,var(--brand-500) 28%,var(--line))!important;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand-50) 45%,var(--surface)),var(--surface))!important;
}
.backup-transfer-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.backup-transfer-guide{
  margin-top:10px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  display:flex;
  flex-direction:column;
  gap:4px;
}
.backup-transfer-guide b{font-size:10px;color:var(--text)}
.backup-transfer-guide span{font-size:9px;line-height:1.55;color:var(--muted)}

.monthly-pdf-save{font-weight:850!important;min-width:72px!important}.monthly-pdf-save span{font-size:inherit!important}
</style>

const memoryStore={};
function safeStorageGet(key){
  try{
    const v=localStorage.getItem(key);
    if(v!==null) return v;
  }catch(e){}
  try{
    const v=sessionStorage.getItem(key);
    if(v!==null) return v;
  }catch(e){}
  return memoryStore[key]??null;
}
function safeStorageSet(key,value,scope='local'){
  let ok=false;
  if(scope==='session'){
    try{sessionStorage.setItem(key,value);ok=true}catch(e){}
  }else{
    try{localStorage.setItem(key,value);ok=true}catch(e){}
  }
  if(!ok) memoryStore[key]=value;
}
function safeStorageRemove(key){
  try{localStorage.removeItem(key)}catch(e){}
  try{sessionStorage.removeItem(key)}catch(e){}
  delete memoryStore[key];
}
function loadDb(){
  const raw=safeStorageGet('tmd-db');

  try{
    const parsed=JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.members) || !Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks)) throw new Error('invalid schema');
    return parsed;
  }catch(e){
    safeStorageRemove('tmd-db');
    return seed();
  }
}

  if(!data || typeof data!=='object') data=fresh;
  arrayKeys.forEach(k=>{ if(!Array.isArray(data[k])) data[k]=Array.isArray(fresh[k])?fresh[k]:[]; });
  if(!data.platformName) data.platformName='Team Management Dashboard';

function bytesToHex(buffer){
  return [...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function makeSalt(){
  const bytes=new Uint8Array(16);
  if(window.crypto?.getRandomValues)window.crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);
  return [...bytes].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function sha256Fallback(ascii){
  function rightRotate(value,amount){return (value>>>amount)|(value<<(32-amount));}
  const mathPow=Math.pow,maxWord=mathPow(2,32),lengthProperty='length';
  let i,j,result='',words=[],asciiBitLength=ascii[lengthProperty]*8;
  let hash=sha256Fallback.h=sha256Fallback.h||[],k=sha256Fallback.k=sha256Fallback.k||[],primeCounter=k[lengthProperty],isComposite={};
  for(let candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii[lengthProperty]%64-56)ascii+='\x00';
  for(i=0;i<ascii[lengthProperty];i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return '';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words[lengthProperty]]=((asciiBitLength/maxWord)|0);
  words[words[lengthProperty]]=asciiBitLength;
  for(j=0;j<words[lengthProperty];){
    const w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      const i2=i+j,w15=w[i-15],w2=w[i-2];
      const a=hash[0],e=hash[4];
      const temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      const temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
      hash.pop();
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){

async function hashPassword(password,salt){
  const raw=`${salt}:${password}`;
  if(window.crypto?.subtle&&typeof TextEncoder!=='undefined'){
    const enc=new TextEncoder().encode(raw);
    return bytesToHex(await window.crypto.subtle.digest('SHA-256',enc));
  }
  return sha256Fallback(unescape(encodeURIComponent(raw)));
}

  // 고정 로그인 별칭 정합성: leader=현재 팀장, member2=장주훈
  if(leader){
    const leaderAcc=db.userAccounts.find(a=>a.memberId===leader.id);
    const conflictingLeader=db.userAccounts.find(a=>a.username?.toLowerCase()==='leader'&&a.memberId!==leader.id);
    if(conflictingLeader)conflictingLeader.username=`member_${conflictingLeader.memberId||conflictingLeader.id}`;
    if(leaderAcc)leaderAcc.username='leader';
  }
  const jang=db.members.find(m=>m.name==='장주훈');
  if(jang){
    const jangAcc=db.userAccounts.find(a=>a.memberId===jang.id);
    const conflictingMember2=db.userAccounts.find(a=>a.username?.toLowerCase()==='member2'&&a.memberId!==jang.id);
    if(conflictingMember2)conflictingMember2.username=`member_${conflictingMember2.memberId||conflictingMember2.id}`;
    if(jangAcc)jangAcc.username='member2';
  }

  // 팀장 변경 시 연결 계정의 역할도 자동 동기화
  db.userAccounts.forEach(a=>{
    if(a.role==='admin'||!a.memberId)return;
    const m=db.members.find(x=>x.id===a.memberId);
    if(!m)return;
    const rr=accountRoleForMember(m);
    a.role=rr.role;a.roleLabel=rr.roleLabel;a.updatedAt=a.updatedAt||new Date().toISOString();
  });
  save();
}

async function login(id,pw){
  ensureV3Data();
  await ensureAccountData();
  const username=(id||'').trim().toLowerCase();
  const account=(db.userAccounts||[]).find(a=>(a.username||'').toLowerCase()===username);
  if(!account)return false;
  if(!account.enabled)throw new Error('ACCOUNT_DISABLED');
  if(account.locked)throw new Error('ACCOUNT_LOCKED');
  const candidate=await hashPassword(pw||'',account.passwordSalt);
  if(candidate!==account.passwordHash){
    account.failedAttempts=(account.failedAttempts||0)+1;
    if(account.failedAttempts>=5){
      account.locked=true;
      accountLog('자동잠금',account,'로그인 5회 실패');
    }else save();
    return false;
  }
  account.failedAttempts=0;
  account.lastLoginAt=new Date().toISOString();
  account.updatedAt=new Date().toISOString();
  currentUser=resolveLoginUser(account);
  safeStorageSet('tmd-session',JSON.stringify(currentUser),'session');
  const login=$('#loginScreen'),shell=$('#appShell');
  if(login){login.classList.add('hidden');login.style.display='none';}
  if(shell){shell.classList.remove('locked');shell.style.pointerEvents='';shell.style.filter='';}
  state.page='home';renderNav();render();$('#breadcrumb').textContent='홈 대시보드';
  $('#platformName')&&($('#platformName').textContent=(db.platformName||'Team Management Dashboard').replace(' Dashboard',''));
  updateSessionUI();audit('로그인','시스템',currentUser.name);accountLog('로그인',account,'정상 로그인');save();return true;
}

function taskFilters(){

    ? db.members.filter(m=>m.id===currentUser.memberId)
    : db.members;
  return `<div class="toolbar task-toolbar">
    <div class="task-status-tabs">${statuses.map(x=>`<button class="filter-chip ${state.taskFilter===x?'active':''}" data-task-filter="${x}">${x}</button>`).join('')}</div>
    <select class="select task-assignee-filter" id="taskAssigneeFilter">
      <option value="전체">담당자 전체</option>
      ${members.map(m=>`<option value="${m.id}" ${state.taskAssigneeFilter===m.id?'selected':''}>${m.name} ${m.rank}</option>`).join('')}

    <input class="input" id="taskSearch" placeholder="업무명·담당자·사업 검색" value="${state.taskSearch||''}">

}

function canBulkDeleteTasks(){
  return !!currentUser&&(currentUser.role==='admin'||currentUser.role==='leader');
}
function updateTaskBulkSelection(){
  const items=$$('[data-task-select]');
  const checked=$$('[data-task-select]:checked');
  const all=$('#taskSelectAll');
  const btn=$('#taskBulkDeleteBtn');
  const count=$('#taskBulkSelectedCount');

  if(all){
    all.checked=items.length>0&&checked.length===items.length;
    all.indeterminate=checked.length>0&&checked.length<items.length;
  }
  if(count)count.textContent=`${checked.length}개 선택`;
  if(btn){
    btn.disabled=checked.length===0;
    btn.setAttribute('aria-disabled',checked.length===0?'true':'false');
  }
}
function bindTaskBulkSelection(){
  if(!canBulkDeleteTasks()||state.page!=='tasks')return;

  const all=$('#taskSelectAll');
  const allWrap=all?.closest('.task-check-wrap');

  if(allWrap){
    allWrap.onclick=e=>e.stopPropagation();
    allWrap.onmousedown=e=>e.stopPropagation();
  }
  if(all){
    all.onclick=e=>e.stopPropagation();
    all.onmousedown=e=>e.stopPropagation();
    all.onchange=e=>{
      e.stopPropagation();
      $$('[data-task-select]').forEach(c=>c.checked=all.checked);
      updateTaskBulkSelection();
    };
  }

  $$('[data-task-select]').forEach(c=>{
    const wrap=c.closest('.task-check-wrap');
    if(wrap){
      wrap.onclick=e=>e.stopPropagation();
      wrap.onmousedown=e=>e.stopPropagation();
    }
    c.onclick=e=>e.stopPropagation();
    c.onmousedown=e=>e.stopPropagation();
    c.onchange=e=>{
      e.stopPropagation();
      updateTaskBulkSelection();
    };
  });

  const btn=$('#taskBulkDeleteBtn');
  if(btn)btn.onclick=e=>{
    e.preventDefault();
    e.stopPropagation();
    deleteSelectedTasks();
  };
  updateTaskBulkSelection();
}
function deleteSelectedTasks(){
  if(!canBulkDeleteTasks())return toast('업무 일괄 삭제 권한이 없습니다.');
  const checked=$$('[data-task-select]:checked');
  const ids=[...new Set(checked.map(c=>c.dataset.taskSelect).filter(Boolean))];
  if(!ids.length)return;

  const targets=db.tasks.filter(t=>ids.includes(t.id));
  if(!targets.length){render();return toast('삭제할 업무를 찾을 수 없습니다.');}

  const count=targets.length;
  if(!confirm(`선택한 업무 ${count}건을 삭제하시겠습니까?\n삭제한 업무는 복구할 수 없습니다.`))return;

  const titles=targets.map(t=>t.title);
  db.tasks=db.tasks.filter(t=>!ids.includes(t.id));

  // 업무 데이터에 기반한 대시보드·사업 진행률·캘린더 표시값은 render 시 즉시 재계산됩니다.
  save();
  audit('일괄삭제','전체 업무',`${count}건: ${titles.slice(0,5).join(', ')}${count>5?' 외':''}`);
  closeDrawer();
  render();
  toast(`선택한 업무 ${count}건을 삭제했습니다.`);
}

const CALENDAR_TYPE_META={
  '업무':{color:'#2f76b6',icon:'✓'},'회의':{color:'#7c5ac7',icon:'◫'},'행사':{color:'#d9822b',icon:'★'},
  '출장':{color:'#177f84',icon:'↗'},'교육':{color:'#408a57',icon:'▤'},'휴가':{color:'#c4567a',icon:'○'}
};
function calendarTypeMeta(type){return CALENDAR_TYPE_META[type]||{color:'#687985',icon:'•'};}
function calendarDateObj(v){const d=new Date((v||TODAY)+'T00:00:00');return isNaN(d)?new Date(TODAY+'T00:00:00'):d;}
function calendarIso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function scheduleAssigneeName(sc){return sc.assignee?nameOf(sc.assignee):(sc.userId?nameOf(sc.userId):'-');}
function scheduleProjectName(sc){return sc.projectId?projectOf(sc.projectId):'-';}
function scheduleStatus(sc){if(sc.status)return sc.status;const end=sc.endDate||sc.date;if(end<TODAY)return '완료';if((sc.startDate||sc.date)>TODAY)return '예정';return '진행중';}
function scheduleRangeContains(sc,iso){const start=sc.startDate||sc.date,end=sc.endDate||sc.date||start;return !!start&&iso>=start&&iso<=end;}
function normalizeCalendarEvents(){
  const events=(db.schedules||[]).map(sc=>({...sc,id:sc.id,source:'schedule',startDate:sc.startDate||sc.date,endDate:sc.endDate||sc.date,type:sc.type||'업무',status:scheduleStatus(sc),assignee:sc.assignee||sc.owner||null,time:sc.startTime||sc.time||'',endTime:sc.endTime||'',projectId:sc.projectId||null,taskId:sc.taskId||null,location:sc.location||'',memo:sc.memo||sc.description||'',createdBy:sc.createdBy||sc.owner||null}));
  (db.leave||[]).forEach(l=>events.push({id:'leave-'+l.id,source:'leave',refId:l.id,title:`${nameOf(l.userId)} ${l.type||'휴가'}`,startDate:l.start,endDate:l.end||l.start,type:'휴가',status:l.status||'승인',assignee:l.userId,time:'',endTime:'',projectId:null,taskId:null,location:'',memo:l.reason||'',createdBy:l.userId}));
  (db.tasks||[]).forEach(t=>{if(t.due)events.push({id:'task-'+t.id,source:'task',refId:t.id,title:t.title,startDate:t.due,endDate:t.due,type:'업무',status:autoStatus(t),assignee:t.assignee,time:'',endTime:'',projectId:t.projectId,taskId:t.id,location:'',memo:t.description||'',createdBy:t.assignee});});
  return events;
}
function filteredCalendarEvents(){const active=new Set(state.calendarTypes||[]),q=(state.calendarSearch||'').trim().toLowerCase();return normalizeCalendarEvents().filter(e=>{if(!active.has(e.type))return false;if(state.calendarAssignee!=='전체'&&e.assignee!==state.calendarAssignee)return false;if(state.calendarStatus!=='전체'&&e.status!==state.calendarStatus)return false;if(q&&!([e.title,scheduleAssigneeName(e),scheduleProjectName(e),e.location,e.memo].join(' ').toLowerCase().includes(q)))return false;return true;});}
function calendarNavigate(direction){let d=calendarDateObj(state.calendarCursor);if(direction==='today'){state.calendarCursor=TODAY;render();return;}if(state.calendarView==='month')d.setMonth(d.getMonth()+direction);else if(state.calendarView==='week')d.setDate(d.getDate()+direction*7);else d.setDate(d.getDate()+direction);state.calendarCursor=calendarIso(d);render();}
function setCalendarView(view){if(['month','week','day'].includes(view)){state.calendarView=view;render();}}

function taskAchievementRate(t){

function projectTasksDeep(projectId){
  const childIds=db.projects.filter(p=>p.parentProjectId===projectId).map(p=>p.id);
  return db.tasks.filter(t=>t.projectId===projectId||childIds.includes(t.projectId));
}
function projectAchievement(projectId){
  const ts=projectTasksDeep(projectId);
  const target=ts.reduce((a,t)=>a+(+t.targetValue||0),0);
  const actual=ts.reduce((a,t)=>a+(+t.actualValue||0),0);
  return {target,actual,rate:target>0?Math.max(0,Math.min(100,Math.round(actual/target*100))):0,count:ts.length};
}

function tenureText(startDate){
  if(!startDate)return '-';
  const start=new Date(startDate+'T00:00:00'),now=new Date(TODAY+'T00:00:00');
  if(isNaN(start)||start>now)return '-';
  let years=now.getFullYear()-start.getFullYear(),months=now.getMonth()-start.getMonth();
  if(now.getDate()<start.getDate())months--;
  if(months<0){years--;months+=12;}
  return years>0?`${years}년 ${months}개월`:`${Math.max(0,months)}개월`;
}

function escapeRichTextPlain(v){
  return esc(v||'').replace(/\n/g,'<br>');

function sanitizeMonthlyRichHtml(html){
  const box=document.createElement('div');box.innerHTML=html||'';
  const allowed=new Set(['B','STRONG','SPAN','BR','DIV','P']);
  [...box.querySelectorAll('*')].forEach(el=>{
    if(!allowed.has(el.tagName)){
      el.replaceWith(...el.childNodes);return;
    }
    [...el.attributes].forEach(a=>{
      if(a.name!=='style')el.removeAttribute(a.name);
    });
    if(el.hasAttribute('style')){
      const style=el.style;
      const keep=[];
      const weight=style.fontWeight;
      const color=style.color;
      if(weight==='bold'||(+weight>=600))keep.push('font-weight:700');
      if(color&&/^((rgb|rgba)\([^)]+\)|#[0-9a-fA-F]{3,8})$/.test(color))keep.push(`color:${color}`);
      el.setAttribute('style',keep.join(';'));
      if(!keep.length)el.removeAttribute('style');
    }
  });
  return box.innerHTML;
}
function monthlySectionHtml(sec){
  if(sec?.contentHtml)return sanitizeMonthlyRichHtml(sec.contentHtml);
  return escapeRichTextPlain(sec?.content||'');
}
function monthlyHtmlToPlain(html){
  const box=document.createElement('div');box.innerHTML=html||'';

function saveMonthlyRichSelection(editor){
  const sel=window.getSelection();if(!sel||!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(editor.contains(range.commonAncestorContainer))window.monthlyRichSelection=range.cloneRange();
}
function restoreMonthlyRichSelection(editor){
  const r=window.monthlyRichSelection;if(!r)return false;
  try{
    if(!editor.contains(r.commonAncestorContainer))return false;
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);return true;
  }catch(e){return false}
}
function monthlySelectionIsBold(editor){
  if(!editor)return false;
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return false;
  let node=sel.anchorNode;
  if(node&&node.nodeType===3)node=node.parentElement;
  while(node&&node!==editor){
    if(node.nodeType===1){
      const tag=node.tagName;
      const weight=getComputedStyle(node).fontWeight;
      if(tag==='B'||tag==='STRONG'||weight==='bold'||parseInt(weight,10)>=600)return true;
    }
    node=node.parentElement;
  }
  try{return document.queryCommandState('bold');}catch(e){return false;}
}
function cleanupMonthlyBoldMarkup(editor){
  if(!editor)return;
  // 불필요한 빈 span/b/strong 정리
  [...editor.querySelectorAll('span,b,strong')].forEach(el=>{
    if(!el.textContent&&!el.querySelector('br')){el.remove();return;}
    if(el.tagName==='SPAN'&&!el.getAttribute('style'))el.replaceWith(...el.childNodes);
  });
}
function toggleMonthlyBold(editor){
  if(!editor)return;
  editor.focus({preventScroll:true});
  restoreMonthlyRichSelection(editor);

  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed){
    toast('굵게 적용 또는 해제할 텍스트를 먼저 선택해주세요.');
    return;
  }
  const range=sel.getRangeAt(0);
  if(!editor.contains(range.commonAncestorContainer)){
    toast('편집 영역의 텍스트를 선택해주세요.');
    return;
  }

  // 브라우저의 contenteditable bold 명령은 선택영역 기준 토글을 지원하므로
  // 이미 굵은 텍스트에서는 다시 클릭 시 정상적으로 해제된다.
  try{
    document.execCommand('bold',false,null);
  }catch(e){
    const isBold=monthlySelectionIsBold(editor);
    if(isBold){
      // fallback: 선택 영역 내 font-weight 제거
      const box=document.createElement('span');
      const frag=range.extractContents();
      box.appendChild(frag);
      [...box.querySelectorAll('b,strong')].forEach(x=>x.replaceWith(...x.childNodes));
      [...box.querySelectorAll('span')].forEach(x=>{
        x.style.fontWeight='';
        if(!x.getAttribute('style'))x.replaceWith(...x.childNodes);
      });
      range.insertNode(box);
      box.replaceWith(...box.childNodes);
    }else{
      const span=document.createElement('span');
      span.style.fontWeight='700';
      try{range.surroundContents(span);}
      catch(err){const frag=range.extractContents();span.appendChild(frag);range.insertNode(span);}
    }
  }

  cleanupMonthlyBoldMarkup(editor);

  // 현재 선택 범위를 다시 저장해 연속 편집 시에도 유지
  const currentSel=window.getSelection();
  if(currentSel&&currentSel.rangeCount){
    try{window.monthlyRichSelection=currentSel.getRangeAt(0).cloneRange();}catch(e){}
  }
}
function applyMonthlyRichFormat(editor,kind,value){
  if(!editor)return;

  if(kind==='bold'){
    toggleMonthlyBold(editor);
    return;
  }

  editor.focus({preventScroll:true});
  restoreMonthlyRichSelection(editor);
  const sel=window.getSelection();

  if(!sel||!sel.rangeCount||sel.isCollapsed){
    toast('서식을 적용할 텍스트를 먼저 선택해주세요.');
    return;
  }
  const range=sel.getRangeAt(0);
  if(!editor.contains(range.commonAncestorContainer)){
    toast('편집 영역의 텍스트를 선택해주세요.');
    return;
  }

  if(kind==='color'){
    const span=document.createElement('span');
    span.style.color=value||'#17334a';
    try{
      range.surroundContents(span);
    }catch(e){
      const frag=range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);
    }
    sel.removeAllRanges();
    const nr=document.createRange();

}

function monthlySlideScaleState(){
  const st=window.monthlySlideState||{};
  if(!Number.isFinite(Number(st.scale)))st.scale=100;
  st.scale=Math.max(50,Math.min(180,Number(st.scale)||100));
  if(typeof st.fit!=='boolean')st.fit=true;
  window.monthlySlideState=st;
  return st;
}
function computeMonthlyFitScale(){
  const stage=$('.monthly-slide-stage');
  const slide=$('.monthly-scale-target');
  if(!stage||!slide)return 100;

  // transform을 제거한 자연 크기를 기준으로 화면에 완전히 들어오도록 계산
  const oldTransform=slide.style.transform;
  const oldWidth=slide.style.width;
  slide.style.transform='none';
  slide.style.width='100%';

  const slideRect=slide.getBoundingClientRect();
  const stageStyle=getComputedStyle(stage);
  const padX=(parseFloat(stageStyle.paddingLeft)||0)+(parseFloat(stageStyle.paddingRight)||0);
  const padY=(parseFloat(stageStyle.paddingTop)||0)+(parseFloat(stageStyle.paddingBottom)||0);
  const navReserve=112;
  const availW=Math.max(280,stage.clientWidth-padX-navReserve);
  const availH=Math.max(180,stage.clientHeight-padY-8);
  const baseW=Math.max(1,slideRect.width);
  const baseH=Math.max(1,slideRect.height);
  const fit=Math.min(availW/baseW,availH/baseH,1);

  slide.style.transform=oldTransform;
  slide.style.width=oldWidth;
  return Math.max(50,Math.min(100,Math.floor(fit*100)));
}
function applyMonthlySlideScale(forceFit=false){
  const st=monthlySlideScaleState();
  const slide=$('.monthly-scale-target');
  const stage=$('.monthly-slide-stage');
  if(!slide||!stage)return;

  const fullscreen=isMonthlySlideFullscreen();

  if(fullscreen){
    // 전체화면에서는 transform 확대 대신 실제 레이아웃 크기로 재렌더링하여
    // 텍스트와 선의 흐림/깨짐을 줄인다.
    slide.style.transform='none';
    slide.style.transformOrigin='center center';
    slide.style.removeProperty('--monthly-slide-scale');
    st.scale=100;
    st.fit=true;
  }else{
    if(forceFit||st.fit){
      st.scale=computeMonthlyFitScale();
      st.fit=true;
    }
    const scale=st.scale/100;
    slide.style.setProperty('--monthly-slide-scale',String(scale));
    slide.style.transform=`scale(${scale})`;
    slide.style.transformOrigin='center center';
  }

  const readout=$('#monthlyScaleReadout');
  if(readout){
    readout.textContent=fullscreen?'화면 최적화':`${Math.round(st.scale)}%`;
    readout.disabled=fullscreen;
  }
  const fitBtn=$('#monthlyFit');
  if(fitBtn){
    fitBtn.classList.toggle('active',!!st.fit);
    fitBtn.disabled=fullscreen;
  }
  const zout=$('#monthlyZoomOut'),zin=$('#monthlyZoomIn');
  if(zout)zout.disabled=fullscreen||st.scale<=50;
  if(zin)zin.disabled=fullscreen||st.scale>=180;
}
function changeMonthlySlideScale(delta){
  const st=monthlySlideScaleState();
  st.fit=false;
  st.scale=Math.max(50,Math.min(180,Math.round(st.scale/10)*10+delta));
  applyMonthlySlideScale(false);
}
function resetMonthlySlideScale(){

  st.fit=false;st.scale=100;

function renderMonthlySlide(){
  const slideState=window.monthlySlideState||{};
  const x=(db.monthlyWork||[]).find(v=>v.id===slideState.id);
  if(!x){
    const body=$('#drawer .drawer-body');
    if(body)body.innerHTML='<div class="monthly-slide-error"><b>슬라이드를 불러올 수 없습니다.</b><span>월 추진업무 데이터가 존재하지 않습니다.</span></div>';
    return;
  }
  const mode=x.authoringMode||'direct';
  const body=$('#drawer .drawer-body');if(!body)return;
  body.classList.add('monthly-slide-drawer-content');

  if(mode==='pdf'){
    if(!x.pdfData){
      body.innerHTML=`<div class="monthly-slide-error"><b>첨부된 PDF가 없습니다.</b><span>편집 화면에서 PDF 파일을 다시 등록해주세요.</span>${canEditMonthlyWork()?`<button type="button" class="primary-btn" id="monthlySlideEdit">월 추진업무 편집</button>`:''}</div>`;
      const edit=$('#monthlySlideEdit');if(edit)edit.onclick=()=>{closeDrawer();setTimeout(()=>openForm('monthlyWork',x),0);};return;
    }
    const ps=window.monthlyPdfViewState||{id:x.id,page:1,zoom:100};
    if(ps.id!==x.id){ps.id=x.id;ps.page=1;ps.zoom=100;}
    window.monthlyPdfViewState=ps;
    body.innerHTML=monthlyPdfViewerHtml(x,ps);
    const prev=$('#pdfPrev'),next=$('#pdfNext'),zin=$('#pdfZoomIn'),zout=$('#pdfZoomOut'),dl=$('#pdfDownload'),errdl=$('#pdfErrorDownload'),edit=$('#monthlySlideEdit');
    if(prev)prev.onclick=()=>{if(ps.page>1){ps.page--;renderMonthlySlide();}};
    if(next)next.onclick=()=>{const total=Math.max(1,x.pdfPages||1);if(ps.page<total){ps.page++;renderMonthlySlide();}};
    if(zin)zin.onclick=()=>{ps.zoom=Math.min(200,ps.zoom+25);renderMonthlySlide();};
    if(zout)zout.onclick=()=>{ps.zoom=Math.max(50,ps.zoom-25);renderMonthlySlide();};
    if(dl)dl.onclick=()=>downloadMonthlyPdf(x);
    if(errdl)errdl.onclick=()=>downloadMonthlyPdf(x);
    if(edit)edit.onclick=()=>{closeDrawer();setTimeout(()=>openForm('monthlyWork',x),0);};
    const frame=$('#monthlyPdfFrame');
    if(frame){
      const failTimer=setTimeout(()=>{},2500);
      frame.onload=()=>clearTimeout(failTimer);
    }
    return;
  }

  const sections=Array.isArray(x.sections)&&x.sections.length?x.sections:[{category:'추진업무',content:'등록된 세부 추진내용이 없습니다.'}];
  slideState.index=Math.max(0,Math.min(Number(slideState.index)||0,sections.length-1));
  window.monthlySlideState=slideState;
  body.innerHTML=monthlySlideHtml(x,slideState.index);

  const prev=$('#monthlyPrev'),next=$('#monthlyNext'),edit=$('#monthlySlideEdit');
  const fit=$('#monthlyFit'),zout=$('#monthlyZoomOut'),zin=$('#monthlyZoomIn'),readout=$('#monthlyScaleReadout'),full=$('#monthlyFullscreen');
const pdfSave=$('#monthlyPdfSave');if(pdfSave)pdfSave.onclick=saveMonthlySlidesAsPdf;
  if(prev)prev.onclick=()=>{if(slideState.index>0)moveMonthlySlide(slideState.index-1);};
  if(next)next.onclick=()=>{if(slideState.index<sections.length-1)moveMonthlySlide(slideState.index+1);};
  $$('[data-slide-index]').forEach(b=>b.onclick=()=>moveMonthlySlide(Number(b.dataset.slideIndex)||0));
  if(fit)fit.onclick=()=>fitMonthlySlide();
  if(zout)zout.onclick=()=>changeMonthlySlideScale(-10);
  if(zin)zin.onclick=()=>changeMonthlySlideScale(10);
  if(readout)readout.onclick=()=>resetMonthlySlideScale();
  if(full)full.onclick=()=>toggleMonthlySlideFullscreen();
  if(edit)edit.onclick=()=>{closeDrawer();setTimeout(()=>openForm('monthlyWork',x),0);};
  requestAnimationFrame(()=>{applyMonthlySlideScale(false);updateMonthlyFullscreenButton();});
}


if(!window.__monthlySlideScaleListenersBound){
  window.__monthlySlideScaleListenersBound=true;
  window.addEventListener('resize',()=>{
    const st=window.monthlySlideState;

  });

async function saveUserAccount(accountId=''){
  if(!canAdmin())return false;
  const existing=accountId?accountById(accountId):null;
  if(accountId&&!existing){toast('수정할 계정을 찾을 수 없습니다.');return false;}

  const username=($('#accountUsername')?.value||'').trim();
  if(!/^[A-Za-z0-9._-]{4,30}$/.test(username)){toast('로그인 아이디는 영문·숫자·._- 조합 4~30자로 입력해주세요.');return false;}
  const duplicate=(db.userAccounts||[]).find(a=>a.id!==accountId&&(a.username||'').toLowerCase()===username.toLowerCase());
  if(duplicate){toast('이미 사용 중인 로그인 아이디입니다.');return false;}

  const memberId=$('#accountMemberId')?.value||null;
  const member=memberId?db.members.find(m=>m.id===memberId):null;
  const rr=member?accountRoleForMember(member):{role:existing?.role||'admin',roleLabel:existing?.roleLabel||'시스템 관리자'};

  if(existing){
    const isCurrent=existing.id===currentUser?.accountId;
    const nextEnabled=$('#accountEnabled')?.checked!==false;
    const nextLocked=!!$('#accountLocked')?.checked;
    if(isCurrent&&(!nextEnabled||nextLocked)){
      toast('현재 로그인 중인 관리자 계정은 사용중지 또는 잠금 처리할 수 없습니다.');
      return false;
    }
    const before=existing.username;
    existing.username=username;
    existing.enabled=nextEnabled;
    existing.locked=nextLocked;
    existing.role=rr.role;existing.roleLabel=rr.roleLabel;
    existing.updatedAt=new Date().toISOString();
    save();
    accountLog('계정수정',existing,`${before!==username?`아이디 ${before} → ${username}; `:''}사용 ${existing.enabled?'허용':'중지'}, 잠금 ${existing.locked?'예':'아니오'}`);
  }else{
    const password=$('#accountPassword')?.value||'';
    if(password.length<8){toast('초기 비밀번호는 8자 이상 입력해주세요.');return false;}
    if(memberId&&accountByMember(memberId)){toast('해당 팀원은 이미 로그인 계정을 보유하고 있습니다.');return false;}
    const acc=await createAccountRecord({
      username,password,role:rr.role,roleLabel:rr.roleLabel,memberId,
      enabled:$('#accountEnabled')?.checked!==false,
      locked:!!$('#accountLocked')?.checked,mustReset:true
    });
    db.userAccounts.push(acc);
    save();
    accountLog('계정생성',acc,member?`${member.name} 계정 생성`:'계정 생성');
  }
  closeModal();
  render();
  toast(existing?'계정정보가 수정되었습니다.':'로그인 계정이 생성되었습니다.');
  return true;
}

async function resetAccountPassword(accountId){
  if(!canAdmin())return false;
  const a=accountById(accountId);if(!a){toast('계정정보를 찾을 수 없습니다.');return false;}
  const p1=$('#resetPassword1')?.value||'',p2=$('#resetPassword2')?.value||'';
  if(p1.length<8){toast('비밀번호는 8자 이상 입력해주세요.');return false;}
  if(p1!==p2){toast('비밀번호 확인값이 일치하지 않습니다.');return false;}
  const salt=makeSalt();
  a.passwordSalt=salt;
  a.passwordHash=await hashPassword(p1,salt);
  a.mustReset=true;a.failedAttempts=0;a.locked=false;a.updatedAt=new Date().toISOString();
  save();accountLog('비밀번호초기화',a,'관리자가 새 비밀번호 설정');
  closeModal();render();toast(`${a.username} 계정의 비밀번호를 초기화했습니다.`);
  return true;
}
function bindAccountManagement(){
  if(!canAdmin()||state.page!=='settings')return;
  $$('[data-account-edit]').forEach(b=>{
    b.onclick=e=>{e.preventDefault();e.stopPropagation();openAccountEditor(b.dataset.accountEdit);};
  });
  $$('[data-account-create]').forEach(b=>{
    b.onclick=e=>{e.preventDefault();e.stopPropagation();openAccountEditor('',b.dataset.accountCreate);};
  });
  $$('[data-account-toggle]').forEach(b=>{
    b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleUserAccount(b.dataset.accountToggle);};
  });
  $$('[data-account-lock]').forEach(b=>{
    b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleAccountLock(b.dataset.accountLock);};
  });
  $$('[data-account-reset]').forEach(b=>{
    b.onclick=e=>{e.preventDefault();e.stopPropagation();openPasswordReset(b.dataset.accountReset);};
  });
}

function dashboardBackupPayload(){
  return {
    format:'TMD_BACKUP',
    version:'5.3-portable',
    exportedAt:new Date().toISOString(),
    data:JSON.parse(JSON.stringify(db))
  };
}
function exportDashboardBackup(){
  if(!canAdmin())return toast('관리자만 전체 데이터를 백업할 수 있습니다.');
  try{
    const payload=dashboardBackupPayload();
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,10).replaceAll('-','');
    a.href=url;a.download=`team-dashboard-backup-${stamp}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('전체 데이터 백업 파일을 생성했습니다.');
  }catch(err){
    console.error('BACKUP_EXPORT_ERROR',err);
    toast('백업 파일 생성에 실패했습니다.');
  }
}
function openDashboardRestorePicker(){
  if(!canAdmin())return toast('관리자만 전체 데이터를 복원할 수 있습니다.');
  let input=$('#dashboardRestoreFile');
  if(!input){
    input=document.createElement('input');
    input.type='file';input.accept='.json,application/json';input.id='dashboardRestoreFile';
    input.style.display='none';
    input.onchange=restoreDashboardBackup;
    document.body.appendChild(input);
  }
  input.value='';input.click();
}
async function restoreDashboardBackup(ev){
  if(!canAdmin())return;
  const file=ev.target.files?.[0];if(!file)return;
  if(!confirm('이 PC의 현재 대시보드 데이터를 백업 파일 내용으로 교체하시겠습니까?'))return;
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    const restored=payload?.format==='TMD_BACKUP'?payload.data:payload;
    if(!restored||!Array.isArray(restored.members)||!Array.isArray(restored.tasks)){
      throw new Error('INVALID_BACKUP');
    }
    db=normalizeDbShape(restored);
    ensureV3Data();
    await ensureAccountData();
    save();
    state.page='home';
    renderNav();render();updateSessionUI();
    toast('전체 데이터가 복원되었습니다. 다시 로그인하면 계정 연결도 동일하게 적용됩니다.');
  }catch(err){
    console.error('BACKUP_RESTORE_ERROR',err);
    toast('올바른 대시보드 백업 파일인지 확인해주세요.');
  }
}

function saveTask(id=''){
  const old=db.tasks.find(x=>x.id===id);
  const targetValue=Math.max(0,+($('#f-target-value')?.value||0));
  const actualValue=Math.max(0,+($('#f-actual-value')?.value||0));
  const obj={
    id:id||'t'+Date.now(),title:$('#f-title').value.trim()||'신규 업무',projectId:$('#f-project').value,
    assignee:$('#f-user').value,start:$('#f-start').value,due:$('#f-due').value,priority:$('#f-priority').value,
    status:$('#f-status').value,progress:Math.max(0,Math.min(100,+$('#f-progress').value||0)),
    targetValue,actualValue,description:$('#f-desc').value.trim(),updated:TODAY
  };
  if(targetValue>0)obj.progress=Math.max(0,Math.min(100,Math.round(actualValue/targetValue*100)));
  if(obj.status==='완료'){obj.progress=100;if(targetValue>0&&actualValue<targetValue)obj.actualValue=targetValue;}
  if(old)Object.assign(old,obj);else db.tasks.push(obj);
  save();audit(old?'수정':'등록','전체 업무',obj.title);
  const returnMember=window.taskEditReturnMemberId;

  closeModal();render();

  toast(old?'업무가 수정되었습니다.':'업무가 등록되었습니다.');
}

function saveSchedule(id=''){
  const old=(db.schedules||[]).find(x=>x.id===id);
  const title=($('#f-title')?.value||'').trim();
  const start=$('#f-start-date')?.value||TODAY;
  const end=$('#f-end-date')?.value||start;

  if(!title){toast('일정명을 입력해주세요.');return false;}
  if(end<start){toast('종료일은 시작일보다 빠를 수 없습니다.');return false;}

  const assignee=$('#f-user')?.value||null;
  if(currentUser.role==='member'&&assignee&&assignee!==currentUser.memberId){
    toast('팀원은 본인 일정만 등록할 수 있습니다.');
    return false;
  }

  const projectId=$('#f-project')?.value||null;
  const taskId=$('#f-task')?.value||null;
  const linkedTask=taskId?db.tasks.find(t=>t.id===taskId):null;
  const resolvedProjectId=projectId||(linkedTask?.projectId||null);
  const resolvedAssignee=assignee||(linkedTask?.assignee||null);

  const obj={
    id:id||'s'+Date.now(),
    title,
    type:$('#f-type')?.value||'업무',
    date:start,startDate:start,endDate:end,
    startTime:$('#f-start-time')?.value||'',
    endTime:$('#f-end-time')?.value||'',
    assignee:resolvedAssignee,
    owner:resolvedAssignee,
    projectId:resolvedProjectId,
    taskId,
    location:($('#f-location')?.value||'').trim(),
    status:$('#f-status')?.value||'예정',
    repeatRule:$('#f-repeat')?.value||'',
    memo:($('#f-memo')?.value||'').trim(),
    description:($('#f-memo')?.value||'').trim(),
    createdBy:old?.createdBy||currentUser.memberId||null
  };

  if(old)Object.assign(old,obj);
  else db.schedules.push(obj);

  window.preselectedCalendarDate=null;
  save();
  audit(old?'수정':'등록','일정관리',obj.title);
  closeModal();

  if(state.page==='calendar'){
    state.calendarSearch='';
    if(state.calendarAssignee!=='전체'&&state.calendarAssignee!==obj.assignee)state.calendarAssignee='전체';
    if(state.calendarStatus!=='전체'&&state.calendarStatus!==obj.status)state.calendarStatus='전체';
    if(!state.calendarTypes.includes(obj.type))state.calendarTypes.push(obj.type);
    state.calendarCursor=obj.startDate;
  }

  render();
  toast(old?'일정이 수정되었습니다.':'일정이 등록되어 캘린더에 반영되었습니다.');
  return true;
}

function previewDocumentFile(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  if(f.size>2*1024*1024){toast('첨부파일은 2MB 이하로 등록해주세요.');ev.target.value='';return;}
  const r=new FileReader();
  r.onload=()=>{
    window.pendingDocumentFileData=r.result;
    window.pendingDocumentFileName=f.name;

const BULK_DELETE_MAP={
  task:['tasks','업무'],project:['projects','사업'],member:['members','팀원'],leave:['leave','휴가'],
  education:['education','교육'],kpi:['kpis','KPI'],meeting:['meetings','회의'],document:['documents','자료'],
  counsel:['counseling','상담·면담'],monthlyWork:['monthlyWork','월 추진업무']

function removeRecordSilent(type,id){
  const map=BULK_DELETE_MAP[type];

  db[key]=(db[key]||[]).filter(x=>x.id!==id);
  if(type==='member'&&Array.isArray(db.memberOrder))db.memberOrder=db.memberOrder.filter(x=>x!==id);

function enhanceBulkDelete(){
  if(!canManage())return;
  if(!['meetings','leave','education','team','documents','performance','reports'].includes(state.page))return;
  $$('.data-table').forEach((table,tableIndex)=>{
    const rows=[...table.querySelectorAll('tbody tr')];
    const deletable=rows.map(row=>{const btn=row.querySelector('[data-delete-type][data-delete-id]');return btn?{row,btn}:null}).filter(Boolean);
    if(!deletable.length)return;
    const headRow=table.querySelector('thead tr');
    if(headRow&&!headRow.querySelector('.bulk-select-head')){
      const th=document.createElement('th');th.className='bulk-select-head';
      th.innerHTML=`<input type="checkbox" class="bulk-checkbox" id="bulkSelectAll-${tableIndex}" aria-label="전체 선택">`;
      headRow.insertBefore(th,headRow.firstElementChild);
    }
    deletable.forEach(({row,btn})=>{
      if(row.querySelector('[data-bulk-select]'))return;
      const td=document.createElement('td');td.className='bulk-select-cell';
      td.innerHTML=`<input type="checkbox" class="bulk-checkbox" data-bulk-select data-bulk-type="${btn.dataset.deleteType}" data-bulk-id="${btn.dataset.deleteId}" aria-label="항목 선택">`;
      row.insertBefore(td,row.firstElementChild);
    });
    const wrap=table.closest('.table-wrap')||table.parentElement;if(!wrap)return;
